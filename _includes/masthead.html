{% include base_path %}
<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><span class="navicon"></span></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist {% if page.url == '/' or page.url == '/index.html' %}selected{% endif %}">
            <span class="site-title" style="margin-right: 160px;">{{ site.title }}</span>
          </li>
 {% for link in site.data.navigation.main %}
  <li class="masthead__menu-item {% if page.url == link.url %}selected{% endif %}">
    <a href="{{ base_path }}{{ link.url }}">{{ link.title }}</a>
  </li>
{% endfor %}
<li id="theme-toggle" class="masthead__menu-item persist tail">
  <a
    role="button"
    aria-label="Toggle light and dark mode"
    title="Turn the light on or off"
  >
    <span id="theme-icon" class="theme-lamp" aria-hidden="true">
      <svg viewBox="0 0 32 32" focusable="false">

        <!-- 灯光 -->
        <path class="theme-lamp__ray" d="M16 2v3"></path>
        <path class="theme-lamp__ray" d="m6.1 6.1 2.1 2.1"></path>
        <path class="theme-lamp__ray" d="M2 16h3"></path>
        <path class="theme-lamp__ray" d="m23.8 8.2 2.1-2.1"></path>
        <path class="theme-lamp__ray" d="M27 16h3"></path>

        <!-- 灯泡 -->
        <path
          class="theme-lamp__bulb"
          d="M23 15.2c0-4-3.1-7.2-7-7.2s-7 3.2-7 7.2c0 2.6 1.3 4.6 3.2 6.1.8.6 1.3 1.5 1.3 2.5h5c0-1 .5-1.9 1.3-2.5 1.9-1.5 3.2-3.5 3.2-6.1Z"
        ></path>

        <!-- 灯座 -->
        <path class="theme-lamp__base" d="M13.5 26h5M14.5 29h3"></path>

      </svg>
    </span>
  </a>
</li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
