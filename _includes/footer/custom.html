<!-- GoatCounter Analytics -->
<script
  data-goatcounter="https://yuliu0322.goatcounter.com/count"
  async
  src="https://gc.zgo.at/count.js">
</script>

<!-- Display website views -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  const counter = document.getElementById("profile-view-count");
  if (!counter) return;

  fetch("https://yuliu0322.goatcounter.com/counter/TOTAL.json?start=2026-10-01", {
    cache: "no-store"
  })
    .then(response => {
      if (!response.ok) throw new Error("Failed to load views");
      return response.json();
    })
    .then(data => {
      if (data.count !== undefined) {
        counter.textContent = data.count;
      }
    })
    .catch(error => console.error("GoatCounter:", error));
});
</script>
